<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1b1640">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Башня">
<title>Башня</title>
<link id="manifest" rel="manifest">
<link id="appleicon" rel="apple-touch-icon">
<link id="favicon" rel="icon">
<style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#1b1640;
  overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;
  -webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:#fff}
body{position:fixed;inset:0}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#hud{position:absolute;z-index:5;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 14px) calc(env(safe-area-inset-right) + 16px) 0 calc(env(safe-area-inset-left) + 16px);
  display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}
#score{font-size:64px;font-weight:800;line-height:1;text-shadow:0 4px 18px rgba(0,0,0,.35);position:absolute;left:0;right:0;text-align:center;top:calc(env(safe-area-inset-top) + 52px);transition:transform .12s}
#score.pop{transform:scale(1.25)}
#best{font-size:15px;font-weight:600;opacity:.85;margin-top:8px}
#mute{pointer-events:auto;width:44px;height:44px;border-radius:22px;border:0;background:rgba(255,255,255,.16);color:#fff;font-size:22px;display:flex;align-items:center;justify-content:center;cursor:pointer;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;
  padding-bottom:calc(env(safe-area-inset-bottom) + 24px);transition:opacity .3s;pointer-events:none}
.screen{background:radial-gradient(ellipse at 50% 45%,rgba(12,8,35,.62) 0%,rgba(12,8,35,.35) 60%,rgba(12,8,35,.15) 100%)}
.screen.hidden{opacity:0}
.screen.show{pointer-events:auto}
h1{font-size:58px;margin:0 0 6px;font-weight:900;letter-spacing:1px;text-shadow:0 6px 24px rgba(0,0,0,.4)}
.sub{font-size:17px;opacity:.9;max-width:300px;line-height:1.4;margin:0 0 30px}
.tap{font-size:20px;font-weight:700;padding:16px 34px;border-radius:40px;background:rgba(255,255,255,.95);color:#2a2160;box-shadow:0 10px 30px rgba(0,0,0,.3);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.07)}}
.big{font-size:96px;font-weight:900;line-height:1;margin:4px 0 4px;text-shadow:0 6px 24px rgba(0,0,0,.4)}
.lbl{font-size:16px;opacity:.8;text-transform:uppercase;letter-spacing:2px}
#newbest{font-size:20px;font-weight:800;color:#ffe16b;margin:8px 0 0;min-height:26px}
#goStats{font-size:16px;opacity:.85;margin:6px 0 28px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div id="best">Рекорд: 0</div>
  <button id="mute" aria-label="Звук">🔊</button>
</div>
<div id="score" style="opacity:0">0</div>
<div id="start" class="screen show">
  <h1>БАШНЯ</h1>
  <p class="sub">Тапай, чтобы уронить блок. Всё, что свисает, отвалится. Попадай идеально — блок подрастёт!</p>
  <div class="tap">Тапни, чтобы начать</div>
</div>
<div id="over" class="screen hidden">
  <div class="lbl">Высота</div>
  <div class="big" id="goScore">0</div>
  <div id="newbest"></div>
  <div id="goStats"></div>
  <div class="tap">Ещё разок!</div>
</div>
<script>
(function(){
'use strict';
// ---------- installable-ish: icon + manifest via data URLs ----------
function makeIcon(size){
  var c=document.createElement('canvas');c.width=c.height=size;var x=c.getContext('2d');
  var g=x.createLinearGradient(0,0,0,size);g.addColorStop(0,'#3b2f8f');g.addColorStop(1,'#e2557a');
  x.fillStyle=g;x.fillRect(0,0,size,size);
  var bh=size*0.12,cols=['#ffd166','#ff8c6b','#ef5d9a','#9b6bff','#5ad1ff'];
  for(var i=0;i<5;i++){var w=size*(0.62-i*0.06),xx=(size-w)/2+(i%2?1:-1)*size*0.02,y=size*0.8-(i+1)*bh;
    x.fillStyle=cols[i];x.fillRect(xx,y,w,bh-2);x.fillStyle='rgba(255,255,255,.25)';x.fillRect(xx,y,w,bh*0.22);}
  return c.toDataURL('image/png');
}
try{
  var i192=makeIcon(192),i512=makeIcon(512);
  var man={name:'Башня',short_name:'Башня',display:'fullscreen',orientation:'portrait',
    background_color:'#1b1640',theme_color:'#1b1640',start_url:location.href.split('#')[0],
    icons:[{src:i192,sizes:'192x192',type:'image/png'},{src:i512,sizes:'512x512',type:'image/png'}]};
  document.getElementById('manifest').href='data:application/manifest+json;charset=utf-8,'+encodeURIComponent(JSON.stringify(man));
  document.getElementById('appleicon').href=i192;
  document.getElementById('favicon').href=i192;
}catch(e){}

// ---------- storage ----------
var LS={get:function(k,d){try{var v=localStorage.getItem(k);return v===null?d:v;}catch(e){return d;}},
        set:function(k,v){try{localStorage.setItem(k,v);}catch(e){}}};
var best=parseInt(LS.get('tower_best','0'),10)||0;
var muted=LS.get('tower_muted','0')==='1';

// ---------- audio ----------
var AC=null,master=null;
function initAudio(){
  if(AC)return; var C=window.AudioContext||window.webkitAudioContext; if(!C)return;
  try{AC=new C();master=AC.createGain();master.gain.value=muted?0:0.5;master.connect(AC.destination);}catch(e){AC=null;}
}
function tone(freq,dur,type,vol,slide){
  if(!AC||muted)return; if(AC.state==='suspended')AC.resume();
  var t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(freq,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,freq*slide),t+dur);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol||0.3,t+0.01);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+0.02);
}
var SCALE=[0,2,4,7,9,12,14,16,19,21,24,26,28,31];
var sfx={
  place:function(){tone(220,0.12,'triangle',0.25,0.6);tone(110,0.1,'sine',0.25,0.5);},
  perfect:function(n){var s=SCALE[Math.min(n-1,SCALE.length-1)],f=440*Math.pow(2,s/12);tone(f,0.25,'sine',0.28);tone(f*2,0.18,'triangle',0.08);},
  grow:function(){tone(660,0.1,'sine',0.2,1.5);setTimeout(function(){tone(990,0.15,'sine',0.2,1.3);},70);},
  over:function(){tone(300,0.6,'sawtooth',0.15,0.25);tone(150,0.7,'sine',0.25,0.3);},
  start:function(){tone(523,0.1,'triangle',0.2);setTimeout(function(){tone(784,0.15,'triangle',0.2);},80);}
};
function vib(p){if(muted)return;try{if(navigator.vibrate)navigator.vibrate(p);}catch(e){}}

// ---------- canvas ----------
var cv=document.getElementById('c'),ctx=cv.getContext('2d');
var W=0,H=0,DPR=1;
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,3);
  W=window.innerWidth;H=window.innerHeight;
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  layout();
}
var BH=30,BASEW=200;
function layout(){
  BH=Math.max(22,Math.min(40,H*0.045));
  BASEW=Math.min(W*0.62,320);
}

// ---------- game state ----------
var STATE='start'; // start | play | over
var stack=[],cur=null,debris=[],parts=[],floaters=[],rings=[];
var score=0,combo=0,maxCombo=0,perfects=0,camY=0,camTarget=0,shake=0,hue0=0,t0=0,overAt=0,flash=0;
var elScore=document.getElementById('score'),elBest=document.getElementById('best');
var scrStart=document.getElementById('start'),scrOver=document.getElementById('over');

function colorFor(i,l){var h=(hue0+i*7)%360;return 'hsl('+h+',75%,'+(l||60)+'%)';}
function updBest(){elBest.textContent='Рекорд: '+best;}
updBest();

function reset(){
  stack=[];debris=[];parts=[];floaters=[];rings=[];
  score=0;combo=0;maxCombo=0;perfects=0;shake=0;flash=0;
  hue0=Math.random()*360;
  var bx=(W-BASEW)/2;
  for(var i=0;i<1;i++)stack.push({x:bx,w:BASEW,i:0,drop:0});
  camY=0;camTarget=0;
  spawn();
}
function speedFor(n){return Math.min(W*0.55+n*W*0.022,W*1.9);} // px/s
function spawn(){
  var top=stack[stack.length-1],n=stack.length;
  var fromLeft=n%2===1;
  var R=Math.max(top.w*1.15,W*0.45);
  cur={x:fromLeft?top.x-R:top.x+R,w:top.w,i:n,dir:fromLeft?1:-1,v:speedFor(n),drop:0};
}
function yOf(i){return H*0.78-(i)*BH;} // world y (top of block i) before camera

function setScore(v){
  score=v;elScore.textContent=score;
  elScore.classList.remove('pop');void elScore.offsetWidth;elScore.classList.add('pop');
}

function tapAction(){
  if(STATE==='start'){startGame();return;}
  if(STATE==='over'){if(performance.now()-overAt>450)startGame();return;}
  if(!cur)return;
  var top=stack[stack.length-1];
  var dx=cur.x-top.x,ad=Math.abs(dx);
  var tol=Math.max(3,BH*0.16,cur.v/60*0.6);
  var y=yOf(cur.i);
  if(ad<=tol){
    // perfect
    combo++;perfects++;maxCombo=Math.max(maxCombo,combo);
    cur.x=top.x;
    var grew=false;
    if(combo>=3&&cur.w<BASEW){var g=Math.min(BASEW-cur.w,BH*0.5);cur.x-=g/2;cur.w+=g;grew=true;
      if(cur.x<0)cur.x=0; if(cur.x+cur.w>W)cur.x=W-cur.w;}
    stack.push({x:cur.x,w:cur.w,i:cur.i,drop:-6});
    setScore(score+1+(combo>=3?1:0));
    sfx.perfect(combo);if(grew)sfx.grow();
    vib(combo>=3?[15,30,15]:15);
    rings.push({x:cur.x+cur.w/2,y:y+BH/2,w:cur.w,h:BH,t:0,c:colorFor(cur.i,80)});
    burst(cur.x+cur.w/2,y+BH/2,cur.w,14+Math.min(combo,10)*3,colorFor(cur.i,75));
    var txt=combo>=2?('Идеально ×'+combo):'Идеально!';
    floaters.push({x:W/2,y:y-10,t:0,txt:txt,size:combo>=3?30:24,c:'#fff'});
    if(grew)floaters.push({x:W/2,y:y-44,t:0,txt:'+ ширина',size:18,c:'#ffe16b'});
    flash=Math.min(0.25,0.08+combo*0.02);
  }else if(ad<cur.w){
    combo=0;
    var nx=Math.max(cur.x,top.x),nw=cur.w-ad;
    var cutX=dx>0?nx+nw:cur.x,cutW=ad;
    debris.push({x:cutX,y:y,w:cutW,h:BH,vx:(dx>0?1:-1)*60,vy:-40,rot:0,vr:(dx>0?1:-1)*2.5,c:colorFor(cur.i)});
    stack.push({x:nx,w:nw,i:cur.i,drop:-4});
    setScore(score+1);
    sfx.place();vib(10);
    shake=Math.min(8,3+ad*0.08);
    burst(dx>0?nx+nw:nx,y+BH/2,4,8,colorFor(cur.i,70));
  }else{
    // miss
    debris.push({x:cur.x,y:y,w:cur.w,h:BH,vx:cur.dir*80,vy:-20,rot:0,vr:cur.dir*2,c:colorFor(cur.i)});
    cur=null;gameOver();return;
  }
  camTarget=Math.max(0,(stack.length-6)*BH);
  spawn();
}

function burst(x,y,w,n,c){
  for(var i=0;i<n;i++){
    var a=Math.random()*Math.PI*2,s=60+Math.random()*220;
    parts.push({x:x+(Math.random()-0.5)*w,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-80,life:0.6+Math.random()*0.5,t:0,r:2+Math.random()*3.5,c:c});
  }
}

function startGame(){
  initAudio();
  reset();STATE='play';t0=performance.now();
  scrStart.classList.add('hidden');scrStart.classList.remove('show');
  scrOver.classList.add('hidden');scrOver.classList.remove('show');
  elScore.style.opacity=1;elScore.textContent='0';
  sfx.start();
}
function gameOver(){
  STATE='over';overAt=performance.now();
  shake=14;sfx.over();vib([60,40,120]);
  var isBest=score>best&&score>0;
  if(score>best){best=score;LS.set('tower_best',String(best));updBest();}
  var secs=Math.round((overAt-t0)/1000);
  document.getElementById('goScore').textContent=score;
  document.getElementById('newbest').textContent=isBest?'🏆 Новый рекорд!':('Рекорд: '+best);
  document.getElementById('goStats').textContent='Идеальных: '+perfects+' · Лучшая серия: '+maxCombo+' · '+secs+' с';
  // zoom out to show whole tower
  setTimeout(function(){
    if(STATE!=='over')return;
    elScore.style.opacity=0;
    scrOver.classList.remove('hidden');scrOver.classList.add('show');
  },700);
}

// ---------- input ----------
var lastTouch=0;
function onDown(e){
  if(e.target&&e.target.id==='mute')return;
  if(e.type==='touchstart'){lastTouch=Date.now();e.preventDefault();}
  else if(Date.now()-lastTouch<600)return; // ignore emulated mouse after touch
  tapAction();
}
document.addEventListener('touchstart',onDown,{passive:false});
document.addEventListener('mousedown',onDown);
function unlockAudio(){initAudio();if(AC&&AC.state==='suspended'){try{AC.resume();}catch(e){}}}
document.addEventListener('touchend',unlockAudio,{passive:true});
document.addEventListener('click',unlockAudio);
document.addEventListener('touchmove',function(e){e.preventDefault();},{passive:false});
document.addEventListener('gesturestart',function(e){e.preventDefault();});
document.addEventListener('dblclick',function(e){e.preventDefault();});
document.addEventListener('contextmenu',function(e){e.preventDefault();});
document.addEventListener('keydown',function(e){if(e.code==='Space'||e.code==='Enter'){e.preventDefault();tapAction();}});
var muteBtn=document.getElementById('mute');
function updMute(){muteBtn.textContent=muted?'🔇':'🔊';if(master)master.gain.value=muted?0:0.5;}
updMute();
function toggleMute(e){e.preventDefault();e.stopPropagation();initAudio();muted=!muted;LS.set('tower_muted',muted?'1':'0');updMute();if(!muted)tone(660,0.08,'sine',0.2);}
muteBtn.addEventListener('touchstart',function(e){lastTouch=Date.now();toggleMute(e);},{passive:false});
muteBtn.addEventListener('mousedown',function(e){if(Date.now()-lastTouch<600){e.stopPropagation();return;}toggleMute(e);});
document.addEventListener('visibilitychange',function(){if(document.hidden&&AC&&AC.state==='running')AC.suspend();});

// ---------- render ----------
function drawBlock(x,y,w,h,i,alpha){
  ctx.globalAlpha=alpha==null?1:alpha;
  ctx.fillStyle=colorFor(i,60);ctx.fillRect(x,y,w,h);
  ctx.fillStyle=colorFor(i,72);ctx.fillRect(x,y,w,h*0.28);
  ctx.fillStyle='rgba(0,0,0,0.12)';ctx.fillRect(x,y+h*0.82,w,h*0.18);
  ctx.globalAlpha=1;
}
function bg(){
  var h=(hue0+stack.length*7)%360,lvl=Math.min(1,stack.length/60);
  var g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'hsl('+((h+200)%360)+',45%,'+(16-lvl*8)+'%)');
  g.addColorStop(1,'hsl('+((h+240)%360)+',50%,'+(32-lvl*10)+'%)');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  // stars appear higher up
  if(lvl>0.15){ctx.fillStyle='rgba(255,255,255,'+(lvl*0.6)+')';
    for(var s=0;s<40;s++){var sx=(s*97.13%1)*W,sx2=((s*53.7)%W),sy=((s*131.7+camY*0.2)%H);ctx.fillRect((sx+sx2)%W,sy,1.5,1.5);}}
}
var last=performance.now(),acc=0,fps=60;
function frame(now){
  var dt=Math.min(0.05,(now-last)/1000);last=now;
  fps=fps*0.95+(1/Math.max(dt,0.001))*0.05;
  update(dt);render();
  requestAnimationFrame(frame);
}
function update(dt){
  if(STATE==='play'&&cur){
    cur.x+=cur.dir*cur.v*dt;
    var top=stack[stack.length-1];
    var R=Math.max(cur.w*1.15,W*0.45),minX=top.x-R,maxX=top.x+R;
    if(cur.x>maxX){cur.x=maxX;cur.dir=-1;}
    if(cur.x<minX){cur.x=minX;cur.dir=1;}
  }
  if(STATE==='over'){ // zoom out to show tower
    var need=(stack.length+1)*BH;camTarget=0;
  }
  camY+=(camTarget-camY)*Math.min(1,dt*6);
  for(var i=0;i<stack.length;i++){var b=stack[i];if(b.drop)b.drop*=Math.pow(0.0001,dt);if(Math.abs(b.drop)<0.05)b.drop=0;}
  for(i=debris.length-1;i>=0;i--){var d=debris[i];d.vy+=1400*dt;d.x+=d.vx*dt;d.y+=d.vy*dt;d.rot+=d.vr*dt;if(d.y-camY>H+200&&d.y>H*2+camY)debris.splice(i,1);}
  for(i=parts.length-1;i>=0;i--){var p=parts[i];p.t+=dt;p.vy+=500*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=0.98;if(p.t>p.life)parts.splice(i,1);}
  for(i=floaters.length-1;i>=0;i--){var f=floaters[i];f.t+=dt;f.y-=40*dt;if(f.t>1)floaters.splice(i,1);}
  for(i=rings.length-1;i>=0;i--){rings[i].t+=dt;if(rings[i].t>0.45)rings.splice(i,1);}
  shake*=Math.pow(0.002,dt);if(shake<0.1)shake=0;
  flash*=Math.pow(0.01,dt);
}
function render(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  bg();
  var sx=(Math.random()-0.5)*shake*2,sy=(Math.random()-0.5)*shake*2;
  // when over: fit whole tower on screen
  var scale=1,oy=camY;
  if(STATE==='over'&&stack.length>8){
    var towerH=stack.length*BH+H*0.3;scale=Math.min(1,(H*0.62)/towerH);
  }
  ctx.save();
  ctx.translate(sx,sy);
  if(scale<1){ctx.translate(W/2,H*0.86);ctx.scale(scale,scale);ctx.translate(-W/2,-H*0.86);}
  ctx.translate(0,oy);
  // ground glow
  ctx.fillStyle='rgba(0,0,0,0.25)';ctx.fillRect(-W,yOf(0)+BH,W*3,H*3);
  for(var i=0;i<stack.length;i++){var b=stack[i];var y=yOf(b.i)+b.drop;
    if(y+oy>H+BH*2/scale&&scale===1)continue; drawBlock(b.x,y,b.w,BH,b.i);}
  if(cur&&STATE==='play'){
    var cy=yOf(cur.i);
    // guide shadow
    var top=stack[stack.length-1];
    ctx.fillStyle='rgba(255,255,255,0.06)';ctx.fillRect(top.x,cy,top.w,BH);
    drawBlock(cur.x,cy,cur.w,BH,cur.i);
  }
  for(i=0;i<debris.length;i++){var d=debris[i];ctx.save();ctx.translate(d.x+d.w/2,d.y+d.h/2);ctx.rotate(d.rot);
    ctx.fillStyle=d.c;ctx.fillRect(-d.w/2,-d.h/2,d.w,d.h);ctx.fillStyle='rgba(255,255,255,.2)';ctx.fillRect(-d.w/2,-d.h/2,d.w,d.h*0.28);ctx.restore();}
  for(i=0;i<rings.length;i++){var r=rings[i],k=r.t/0.45,e=8+k*28;
    ctx.globalAlpha=1-k;ctx.strokeStyle=r.c;ctx.lineWidth=3*(1-k)+1;ctx.strokeRect(r.x-r.w/2-e,r.y-r.h/2-e*0.6,r.w+e*2,r.h+e*1.2);}
  ctx.globalAlpha=1;
  for(i=0;i<parts.length;i++){var p=parts[i];ctx.globalAlpha=Math.max(0,1-p.t/p.life);ctx.fillStyle=p.c;
    ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,6.283);ctx.fill();}
  ctx.globalAlpha=1;
  ctx.textAlign='center';ctx.textBaseline='middle';
  for(i=0;i<floaters.length;i++){var f=floaters[i],a=f.t<0.15?f.t/0.15:Math.max(0,1-(f.t-0.4)/0.6),s=f.t<0.15?0.6+f.t/0.15*0.4:1;
    ctx.globalAlpha=a;ctx.font='800 '+Math.round(f.size*s)+'px -apple-system,Segoe UI,Roboto,sans-serif';
    ctx.fillStyle='rgba(0,0,0,.25)';ctx.fillText(f.txt,f.x+2,f.y+3);ctx.fillStyle=f.c;ctx.fillText(f.txt,f.x,f.y);}
  ctx.globalAlpha=1;
  ctx.restore();
  if(flash>0.005){ctx.fillStyle='rgba(255,255,255,'+flash+')';ctx.fillRect(0,0,W,H);}
}

window.addEventListener('resize',resize);
window.addEventListener('orientationchange',function(){setTimeout(resize,200);});
resize();
// idle demo tower behind start screen
reset();
